<!DOCTYPE html>

<title>kennedi 404</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#EDE8EB;
    font-family:Arial, Helvetica, sans-serif;
    color:#555;
    cursor:url("images/cursor.webp") 32 32, auto;

    background-image: url("");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
}

.boxalt{
    text-align: center;
}

/* Main layout */

.container{
    width:980px;
    margin:40px auto;
    display:flex;
    gap:20px;
}

h3{
    font-size:15px;
    color:#C2A5AB;
    margin-bottom:10px;
}

.center {
    text-align: center;
}

l {
    display: block;
    text-align: center;
}

/* Sidebar */

.sidebar{
    width:220px;
    border:1px solid #d9d9d9;
    background:#fff;
}

.sidebar img{
    width:100%;
    display:block;
}

.profile{
    padding:15px;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    user-select: none;
}

.profile h2{
    font-size:18px;
    color:#C2A5AB;
    margin-bottom:10px;
    text-align: center;
}

.profile p{
    font-size:13px;
    line-height:1.5;
}

.links{
    margin-top:15px;
    padding-top:5px;
    border-top:1px solid #eee;
    text-align:center;
    line-height:1;
}

.links a{
    display:inline-block;
    padding:7px 9px;
    margin:0;
    color:#8C6F75;
    text-decoration:underline;
    border:0;
    background:none;
    font-size:13px;
    font-weight:normal;
    vertical-align:middle;
}

.links a:hover,
.links a.active{
    color:#8C6F75;
    background:#fffafb;
    text-decoration:none;
}

/* Right side */

.content{
    flex:1;
}

/* Pages */

.page{
    display:none;
}

.page.active{
    display:block;
}

/* Posts */

.gallerypost{
    border:1px solid #d9d9d9;
    margin-bottom:18px;
    background:#fff;
}

.post{
    border:1px solid #d9d9d9;
    margin-bottom:18px;
    background:#fff;
}


.post img{
    width:100%;
    display:block;
    -webkit-user-drag: none;
    user-drag: none;
    -webkit-user-select: none;
    user-select: none;
    pointer-events: none;
}

.post-content{
    padding:18px;
}

.post h3{
    color:#998F8A;
    margin-bottom:10px;
    font-weight:normal;
}

.post p{
    line-height:1.7;
    font-size:14px;
}


</style>
</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <div class="sidebar"> 	

        <div class="profile">

            <h2>kennedi cotarelo</h2>
            <p style="text-align: center;">
                personal website<br>
            </p>
<br>
<br>
<br>

            <div class="links">

                <a href="index.html">← home</a>

            </div>

        </div>

    </div>

    <div class="content">

            <div class="post">

                <div class="post-content">

                    <h3>404</h3>
	      <p>no such page.</p>

                </div>

            </div>

</body>
</html>
